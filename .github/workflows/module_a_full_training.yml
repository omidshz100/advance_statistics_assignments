name: Module A full notebook training and outputs
on:
  pull_request:
    paths:
      - 'moduleA/tests/execute_full_notebook.py'
      - '.github/workflows/module_a_full_training.yml'
jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: q-learning
            notebook: 'Assignment1/01 LAB_A Q_Learning.ipynb'
          - key: dqn
            notebook: 'Assignment1/02 LAB_A DQN.ipynb'
          - key: sarsa
            notebook: 'Assignment1/03 LAB_A SARSA.ipynb'
          - key: cartpole-bonus
            notebook: 'Assignment1/04 LAB_A Bonus.ipynb'
          - key: reinforce
            notebook: 'Assignment2/04 LAB_A Reinforce.ipynb'
          - key: actor-critic
            notebook: 'Assignment2/05 LAB_ A_Actor Critic.ipynb'
          - key: ppo
            notebook: 'Assignment2/06 LAB_A PPO.ipynb'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install swig
          python -m pip install "gymnasium[box2d]>=1.0" "stable-baselines3>=2.3" "torch>=2.2" "matplotlib>=3.8" "numpy>=1.26" "seaborn>=0.13" "imageio-ffmpeg>=0.5" "moviepy>=2.0" "ipython>=8.0" "ipykernel>=6.0" "nbclient>=0.10" "nbformat>=5.0" "jupyterlab>=4.0"
      - name: Train and execute all notebook cells
        run: python moduleA/tests/execute_full_notebook.py "${{ matrix.notebook }}"
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: module-a-executed-${{ matrix.key }}
          path: moduleA/**/**/*.ipynb
          retention-days: 14

  collect:
    needs: execute
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: module-a-executed-*
          path: moduleA/_executed_collect
      - name: Restore executed notebook outputs into their actual paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("moduleA/_executed_collect")
          for file in root.rglob("*.ipynb"):
              matches=list(Path("moduleA").rglob(file.name))
              matches=[p for p in matches if "_executed_collect" not in str(p)]
              if len(matches)!=1:
                  raise RuntimeError(f"Ambiguous notebook {file.name}: {matches}")
              shutil.copy2(file,matches[0])
              print("Restored",matches[0])
          PY
          rm -rf moduleA/_executed_collect
          python -m unittest discover -s moduleA/tests -p 'test_*.py'
      - name: Commit verified full execution outputs to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moduleA/Assignment1 moduleA/Assignment2
          git diff --cached --quiet && exit 0
          git commit -m "Save actual Module A complete-run notebook outputs [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
